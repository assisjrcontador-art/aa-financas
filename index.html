function renderCards(){let future=months.filter(k=>mi(k)>=mi(mk())).slice(0,8);$('#cards').innerHTML=`<div class="kpis">${['Assis','Andressa'].map(o=>`<div class="card kpi"><label>Próxima projeção · ${o}</label><strong>${fmt(cardProj(o,future[0]))}</strong><span class="mut">Compras cadastradas alimentam os meses futuros</span></div>`).join('')}</div><div class="grid2"><div class="card section"><div class="toolbar"><div><h2>Projeção das faturas</h2><div class="mut">Parcelas importadas + novas compras.</div></div><button class="btn primary" onclick="newCard()">＋ Nova compra</button></div><div class="tablewrap"><table><thead><tr><th>Mês</th><th class="money">Assis</th><th class="money">Andressa</th><th class="money">Total</th></tr></thead><tbody>${future.map(k=>`<tr><td>${label(k)}</td><td class="money">${fmt(cardProj('Assis',k))}</td><td class="money">${fmt(cardProj('Andressa',k))}</td><td class="money"><b>${fmt(cardProj('Assis',k)+cardProj('Andressa',k))}</b></td></tr>`).join('')}</tbody></table></div></div><div class="card section"><h2>Compras cadastradas</h2><div class="mut">${db.cards.length} lançamentos entre os dois cartões.</div><div class="tablewrap"><table><tbody>${db.cards.slice().reverse().map(c=>`<tr><td><b>${esc(c.title)}</b><div class="mut">${c.owner} · ${c.total>1?c.current+'/'+c.total:'à vista'}</div></td><td class="money">${fmt(c.amount)}</td><td><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn" onclick="editCard('${c.id}')">Editar</button><button class="btn red" onclick="delCard('${c.id}')">×</button></div></td></tr>`).join('')}</tbody></table></div></div></div>`}
function newCard(){modal(`<div class="mh"><h2>Nova compra no cartão</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><label>Cartão<select id="cOwner"><option>Assis</option><option>Andressa</option></select></label><label>Data da compra<input id="cDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="full">Descrição<input id="cTitle"></label><label>Valor da parcela / compra<input id="cAmount" type="number" step=".01"></label><label>Tipo<select id="cType" onchange="$('#parts').style.display=this.value==='parcelada'?'grid':'none'"><option value="vista">À vista</option><option value="parcelada">Parcelada</option><option value="recorrente">Recorrente</option></select></label><div id="parts" class="full form" style="display:none;margin:0"><label>Parcela atual<input id="cCurrent" type="number" value="1"></label><label>Total de parcelas<input id="cTotal" type="number" value="2"></label></div><button class="btn primary full" onclick="saveCard()">Adicionar e projetar orçamento</button></div>`)}
function saveCard(){let t=$('#cType').value,c={id:'cc'+Date.now(),owner:$('#cOwner').value,title:$('#cTitle').value||'Compra',amount:+$('#cAmount').value||0,date:$('#cDate').value,current:t==='parcelada'?+$('#cCurrent').value:1,total:t==='parcelada'?+$('#cTotal').value:1,recurring:t==='recorrente'};db.cards.push(c);syncCardBudgets();persist();closeM();renderAll()} function editCard(id){let c=db.cards.find(x=>x.id===id);if(!c)return;modal(`<div class="mh"><h2>Editar compra do cartão</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><label>Cartão<select id="eOwner"><option ${c.owner==='Assis'?'selected':''}>Assis</option><option ${c.owner==='Andressa'?'selected':''}>Andressa</option></select></label><label>Data<input id="eDate" type="date" value="${c.date}"></label><label class="full">Descrição<input id="eTitle" value="${esc(c.title)}"></label><label>Valor<input id="eAmount" type="number" step=".01" value="${c.amount}"></label><label>Parcela atual<input id="eCurrent" type="number" value="${c.current}"></label><label>Total de parcelas<input id="eTotal" type="number" value="${c.total}"></label><label>Recorrente<select id="eRecurring"><option value="false" ${!c.recurring?'selected':''}>Não</option><option value="true" ${c.recurring?'selected':''}>Sim</option></select></label><button class="btn primary full" onclick="saveCardEdit('${c.id}')">Salvar alterações e recalcular projeções</button></div>`)}
function saveCardEdit(id){let c=db.cards.find(x=>x.id===id);if(!c)return;c.owner=$('#eOwner').value;c.date=$('#eDate').value;c.title=$('#eTitle').value||'Compra';c.amount=+$('#eAmount').value||0;c.current=Math.max(1,+$('#eCurrent').value||1);c.total=Math.max(c.current,+$('#eTotal').value||1);c.recurring=$('#eRecurring').value==='true';syncCardBudgets();persist();closeM();renderAll()}
function delCard(id){if(confirm('Excluir esta compra e recalcular projeções?')){db.cards=db.cards.filter(c=>c.id!==id);syncCardBudgets();persist();renderAll()}}
function syncCardBudgets(){months.forEach(k=>['Assis','Andressa'].forEach(o=>{let row=budgetRows(k,'expense').find(x=>norm(x.category)===norm('Nubank - '+o));if(row){let projected=cardProj(o,k);row.cardProjection=projected; if(projected>row.budget)row.budget=projected}}))}
function rValue(r,daysAhead=0){let start=new Date(r.start+'T12:00:00'),today=new Date();today.setDate(today.getDate()+daysAhead);let days=Math.max(0,Math.floor((today-start)/86400000)),daily=Math.pow(1+(+r.rate/100),1/30)-1;return +r.principal*Math.pow(1+daily,days)}
function monthKeyFromDate(d){return ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'][d.getMonth()]+String(d.getFullYear()).slice(-2)}
function aaProjection(){let aa=db.reserves.find(r=>r.id==='aa'), now=new Date(), currentKey=monthKeyFromDate(now), keys=Object.keys(db.budget).filter(k=>/^(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\d{2}$/.test(k));let months=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];keys.sort((a,b)=>(2000+ +a.slice(-2))*12+months.indexOf(a.slice(0,3))-( (2000+ +b.slice(-2))*12+months.indexOf(b.slice(0,3))));let ci=keys.indexOf(currentKey);if(ci<0)ci=keys.findIndex(k=>((2000+ +k.slice(-2))*12+months.indexOf(k.slice(0,3)))>=now.getFullYear()*12+now.getMonth());if(ci<0)ci=0;let future=keys.slice(ci);let base=rValue(aa), bal=base, rate=+aa.rate/100, rows=[];future.forEach((k,n)=>{let br=budgetRows(k,'expense').find(x=>norm(x.category)==='reserva'),planned=br?+br.budget:0,real=actual('reserva','despesa',k);let contribution=n===0?Math.max(0,planned-real):planned;bal=bal*(1+rate)+contribution;rows.push({key:k,label:label(k).replace('20','/'),base:base,total:bal,projected:Math.max(0,bal-base),contribution:contribution,interest:Math.max(0,bal-base-rows.reduce((s,x)=>s+x.contribution,0)-contribution)});});return {base,rows,totalContrib:rows.reduce((s,x)=>s+x.contribution,0),final:rows.length?rows[rows.length-1].total:base}}
function aaProjectionHTML(){let p=aaProjection();if(!p.rows.length)return '';let max=Math.max(...p.rows.map(x=>x.total),p.base);return `<div class="card reserve-projection"><div class="projection-head"><div><span class="tag">A&A · rota patrimonial</span><h2>Patrimônio projetado com rendimento composto</h2><div class="mut">Cada coluna é o saldo total daquele mês. A taxa mensal incide sobre o saldo anterior; portanto a projeção cresce mesmo quando o aporte do mês for zero.</div></div><div class="projection-kpis"><div><small>Saldo atual</small><b>${fmt(p.base)}</b></div><div><small>Rendimento projetado</small><b>${fmt(p.totalInterest)}</b></div><div><small>Saldo final projetado</small><b>${fmt(p.final)}</b></div></div></div><div class="vchart" style="height:300px">${p.rows.map(x=>`<div class="vcol" title="${x.label} · saldo ${fmt(x.total)} · rendimento do mês ${fmt(x.interest)}"><div class="vvalue">${fmt(x.total).replace('R$ ','')}</div><div class="vbar" style="height:${Math.max(8,x.total/max*230)}px"></div><div class="vlabel">${x.label}</div></div>`).join('')}</div><div class="mut" style="margin-top:12px">Rendimento acumulado projetado: <b class="positive">${fmt(p.totalInterest)}</b>. Taxa cadastrada: ${db.reserves.find(r=>r.id==='aa').rate}% a.m.</div></div>`}
function renderReserves(){let personal=db.reserves.filter(r=>r.owner==='Casal').reduce((s,r)=>s+rValue(r),0);let proj=aaProjection();$('#reserves').innerHTML=`<div class="kpis"><div class="card kpi"><label>Patrimônio financeiro do casal</label><strong>${fmt(personal)}</strong><span class="mut">A&A + reservas com objetivos específicos</span></div><div class="card kpi"><label>A&A hoje</label><strong>${fmt(proj.base)}</strong><span class="mut">Saldo realizado corrigido pela taxa cadastrada</span></div><div class="card kpi"><label>Aportes futuros já orçados</label><strong>${fmt(proj.totalContrib)}</strong><span class="mut">Vêm automaticamente da categoria Reserva</span></div><div class="card kpi"><label>A&A projetado</label><strong>${fmt(proj.final)}</strong><span class="mut">Com rendimento + orçamento atual</span></div></div><div class="reserve-grid">${db.reserves.map((r,i)=>{let v=rValue(r),goal=+r.goal||0,p=goal?Math.min(100,v/goal*100):0;return `<div class="card reserve"><span class="tag">${esc(r.owner)}</span><h2>${esc(r.name)}</h2><div class="big">${fmt(v)}</div><div class="mut">${esc(r.purpose)} · ${r.rate}% a.m.</div>${goal?`<div class="goal"><i style="width:${p}%"></i></div><small>${p.toFixed(1)}% da meta de ${fmt(goal)}</small>`:''}<div class="actions" style="margin-top:16px"><button class="btn" onclick="editReserve(${i})">Editar</button><button class="btn soft" onclick="projectReserve(${i})">Simular</button></div></div>`}).join('')}${aaProjectionHTML()}</div>`}
function editReserve(i){let r=db.reserves[i];modal(`<div class="mh"><h2>${esc(r.name)}</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><label>Nome<input id="rName" value="${esc(r.name)}"></label><label>Saldo base<input id="rPrincipal" type="number" step=".01" value="${r.principal}"></label><label>Taxa mensal %<input id="rRate" type="number" step=".01" value="${r.rate}"></label><label>Meta<input id="rGoal" type="number" step=".01" value="${r.goal||0}"></label><label class="full">Objetivo<input id="rPurpose" value="${esc(r.purpose)}"></label><button class="btn primary full" onclick="saveReserve(${i})">Salvar</button></div>`)} function saveReserve(i){let r=db.reserves[i];r.name=$('#rName').value;r.principal=+$('#rPrincipal').value;r.rate=+$('#rRate').value;r.goal=+$('#rGoal').value;r.purpose=$('#rPurpose').value;r.start=new Date().toISOString().slice(0,10);persist();closeM();renderAll()}
function projectReserve(i){let r=db.reserves[i],ap=+(prompt('Aporte mensal para simular','500')||0),rate=+r.rate/100,bal=rValue(r);let rows=[];for(let m=1;m<=24;m++){bal=bal*(1+rate)+ap;if([6,12,18,24].includes(m))rows.push([m,bal])}modal(`<div class="mh"><h2>Projeção · ${esc(r.name)}</h2><button class="btn" onclick="closeM()">×</button></div><p class="mut">Com aporte mensal de ${fmt(ap)} e taxa atual de ${r.rate}% a.m.</p>${rows.map(x=>`<div class="income-row"><b>${x[0]} meses</b><strong>${fmt(x[1])}</strong></div>`).join('')}`)}
function renderAnalytics(){let cats=db.categories.filter(c=>c.type==='despesa');$('#analytics').innerHTML=`<div class="card section"><h2>Totalizador por categoria</h2><div class="mut">Histórico de orçamento e realizado em todos os meses cadastrados.</div><div class="tablewrap"><table><thead><tr><th>Categoria</th><th class="money">Orçado acumulado</th><th class="money">Realizado acumulado</th></tr></thead><tbody>${cats.map(c=>{let b=months.reduce((s,k)=>s+budgetRows(k,'expense').filter(x=>norm(x.category)===norm(c.name)).reduce((q,x)=>q+ +x.budget,0),0),a=db.actuals.filter(x=>x.type==='despesa'&&norm(x.category)===norm(c.name)).reduce((s,x)=>s+ +x.amount,0);return `<tr><td><b>${esc(c.name)}</b></td><td class="money">${fmt(b)}</td><td class="money">${fmt(a)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function renderFerreira(){let rec=db.ferreira.filter(x=>x.type==='Receita').reduce((s,x)=>s+x.amount,0),des=db.ferreira.filter(x=>x.type==='Despesa').reduce((s,x)=>s+x.amount,0),budDes=db.ferreira.filter(x=>x.type==='Despesa').reduce((s,x)=>s+(x.budget??x.amount),0);$('#ferreira').innerHTML=`<div class="kpis"><div class="card kpi"><label>Receitas</label><strong>${fmt(rec)}</strong></div><div class="card kpi"><label>Despesas orçadas</label><strong>${fmt(budDes)}</strong></div><div class="card kpi"><label>Despesas realizadas</label><strong>${fmt(des)}</strong></div><div class="card kpi"><label>Reserva Ferreira Imóveis</label><strong>${fmt(rValue(db.reserves.find(r=>r.id==='fi')))}</strong></div></div><div class="card section"><div class="toolbar"><div><h2>Ferreira Imóveis</h2><div class="mut">Fluxo separado do patrimônio do casal · clique em editar para ajustar qualquer linha.</div></div><button class="btn primary" onclick="newFerreira()">＋ Novo lançamento</button></div><div class="tablewrap"><table><thead><tr><th>Descrição</th><th>Tipo</th><th class="money">Orçado</th><th class="money">Realizado</th><th></th></tr></thead><tbody>${db.ferreira.map((x,i)=>`<tr><td><b>${esc(x.description)}</b></td><td>${x.type}</td><td class="money">${fmt(x.budget??x.amount)}</td><td class="money">${fmt(x.amount)}</td><td><button class="btn" onclick="editFerreira(${i})">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`}
function editFerreira(i){let x=db.ferreira[i];modal(`<div class="mh"><h2>Editar · Ferreira Imóveis</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><label class="full">Descrição<input id="fDesc" value="${esc(x.description)}"></label><label>Tipo<select id="fType"><option ${x.type==='Receita'?'selected':''}>Receita</option><option ${x.type==='Despesa'?'selected':''}>Despesa</option></select></label><label>Orçado<input id="fBudget" type="number" step=".01" value="${x.budget??x.amount}"></label><label>Realizado<input id="fAmount" type="number" step=".01" value="${x.amount}"></label><button class="btn primary full" onclick="saveFerreira(${i})">Salvar</button></div>`)}

function renderCategories(){let rows=db.categories;$('#categories').innerHTML=`<div class="card section"><div class="toolbar"><div><h2>Cadastro de categorias</h2><div class="mut">Crie, renomeie, desative ou arquive. O histórico nunca é apagado.</div></div><button class="btn primary" onclick="newCategory()">＋ Nova categoria</button></div><div class="tablewrap"><table><thead><tr><th>Categoria</th><th>Tipo</th><th>Comportamento</th><th>Status</th><th></th></tr></thead><tbody>${rows.map((c,i)=>`<tr><td><b>${esc(c.name)}</b></td><td>${c.type}</td><td>${c.behavior}</td><td><span class="tag">${c.active?'Ativa':'Inativa'}</span></td><td><button class="btn" onclick="editCategory(${i})">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`}
function newCategory(){categoryEditor(-1)}

function categoryEditor(i){let c=i>=0?db.categories[i]:{name:'',type:'despesa',behavior:'obrigacao',active:true};modal(`<div class="mh"><div><h2>${i>=0?'Editar categoria':'Nova categoria'}</h2><div class="mut">Nome, tipo e comportamento são totalmente editáveis.</div></div><button class="btn" onclick="closeM()">×</button></div><div class="form"><label class="full">Nome da categoria<input id="catName" value="${esc(c.name)}" placeholder="Ex.: Psicólogo"></label><label>Tipo<select id="catType"><option value="despesa" ${c.type==='despesa'?'selected':''}>Despesa</option><option value="receita" ${c.type==='receita'?'selected':''}>Receita</option></select></label><label>Comportamento<select id="catBeh"><option value="obrigacao" ${c.behavior==='obrigacao'?'selected':''}>Obrigação</option><option value="consumo" ${c.behavior==='consumo'?'selected':''}>Consumo</option><option value="receita" ${c.behavior==='receita'?'selected':''}>Receita</option></select></label><label>Status<select id="catActive"><option value="true" ${c.active?'selected':''}>Ativa</option><option value="false" ${!c.active?'selected':''}>Inativa</option></select></label><div></div><div class="full actions"><button class="btn primary" onclick="saveCategory(${i})">Salvar categoria</button>${i>=0?`<button class="btn red" onclick="archiveCategory(${i})">Desativar</button><button class="btn red" onclick="deleteCategory(${i})">Apagar cadastro</button>`:''}</div></div>`)}
function saveCategory(i){let name=$('#catName').value.trim();if(!name)return alert('Informe o nome da categoria.');let c=i>=0?db.categories[i]:null,old=c?c.name:null,obj=c||{id:'c'+Date.now()};obj.name=name;obj.type=$('#catType').value;obj.behavior=$('#catBeh').value;obj.active=$('#catActive').value==='true';if(!c)db.categories.push(obj);if(old&&norm(old)!==norm(name)){Object.values(db.budget).forEach(m=>['income','expense'].forEach(t=>(m[t]||[]).forEach(r=>{if(norm(r.category)===norm(old))r.category=name})));db.actuals.forEach(a=>{if(norm(a.category)===norm(old))a.category=name})}persist();closeM();renderAll()}
function archiveCategory(i){db.categories[i].active=false;persist();closeM();renderAll()}
function deleteCategory(i){let c=db.categories[i],used=Object.values(db.budget).some(m=>['income','expense'].some(t=>(m[t]||[]).some(r=>norm(r.category)===norm(c.name))))||db.actuals.some(a=>norm(a.category)===norm(c.name));if(used){alert('Esta categoria já possui histórico. Para preservar seus relatórios, ela será desativada em vez de apagada.');db.categories[i].active=false}else if(confirm('Apagar esta categoria do cadastro?'))db.categories.splice(i,1);persist();closeM();renderAll()}
function renderBackup(){$('#backup').innerHTML=`<div class="card section"><h2>Backup e portabilidade</h2><p class="mut">Os dados ficam neste navegador. Exporte um backup regularmente e importe em outro dispositivo quando necessário.</p><div class="actions"><button class="btn primary" onclick="exportData()">Exportar backup</button><label class="btn">Importar backup<input type="file" accept="application/json" hidden onchange="importData(this.files[0])"></label><button class="btn red" onclick="resetData()">Restaurar versão inicial</button></div></div>`} function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='AA-financas-backup.json';a.click()} function importData(f){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);persist();renderAll();alert('Backup importado.')}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)} function resetData(){if(confirm('Apagar alterações locais e restaurar os dados iniciais?')){db=JSON.parse(JSON.stringify(SEED));persist();renderAll()}}
function openQuick(){let rows=budgetRows(mk(),'expense');modal(`<div class="mh"><h2>Registro rápido</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><label class="full">Categoria<select id="qCat">${rows.map((x,i)=>`<option value="${i}">${esc(x.category)}</option>`).join('')}</select></label><label>Valor<input id="qVal" type="number" step=".01" autofocus></label><label>Data<input id="qDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><button class="btn primary full" onclick="saveQuick()">Registrar despesa</button></div>`)} function saveQuick(){let x=budgetRows(mk(),'expense')[+$('#qCat').value],v=+$('#qVal').value||0;if(v)db.actuals.push({id:'a'+Date.now(),month:mk(),category:x.category,type:'despesa',amount:v,date:$('#qDate').value});persist();closeM();renderAll()}
function modal(s){$('#modalBox').innerHTML=s;$('#modal').classList.add('open')} function closeM(){$('#modal').classList.remove('open')} $('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

/* ===== A&A v7 ===== */
let aaScope='Casal', cardFilterV7='Todos';

function setAAScope(v){aaScope=v;renderAll()}
function scopeHTML(){return `<div class="scopebar">${['Assis','Andressa','Casal'].map(v=>`<button class="chip ${aaScope===v?'active':''}" onclick="setAAScope('${v}')">${v==='Casal'?'Casal / Consolidado':v}</button>`).join('')}</div>`}
function inferredIncomeOwner(x){let n=norm(x.category);if(n.includes('andressa'))return 'Andressa';if(n.includes('assis'))return 'Assis';return x.owner||'Casal'}
function ownerMatch(x,scope=aaScope){return scope==='Casal'||(x.owner||'Casal')===scope}
function incomeMatch(x,scope=aaScope){return scope==='Casal'||inferredIncomeOwner(x)===scope}
function scopedExpenseRows(k=mk(),scope=aaScope){return budgetRows(k,'expense').filter(x=>ownerMatch(x,scope))}
function scopedIncomeRows(k=mk(),scope=aaScope){return budgetRows(k,'income').filter(x=>incomeMatch(x,scope))}
function scopedIncome(k=mk(),real=false,scope=aaScope){return scopedIncomeRows(k,scope).reduce((s,x)=>s+(real?actual(x.category,'receita',k):(+x.budget||0)),0)}
function scopedExpense(k=mk(),real=false,scope=aaScope){return scopedExpenseRows(k,scope).reduce((s,x)=>s+(real?actual(x.category,'despesa',k):(+x.budget||0)),0)}
function isFreeRow(x){let n=norm(x.category);return n==='assis'||n==='andressa'||n==='saldo livre'||n==='saldo livre - assis'||n==='saldo livre - andressa'}
function freeOwner(x){let n=norm(x.category);if(n.includes('andressa'))return 'Andressa';if(n.includes('assis'))return 'Assis';return x.owner||'Casal'}
function isReserveRow(x){return norm(x.category)==='reserva'}
function surplusEligible(x){let n=norm(x.category);return x.behavior!=='consumo'&&!['feira','gasolina','reserva','assis','andressa','saldo livre','saldo livre - assis','saldo livre - andressa'].includes(n)}
function surplusFor(owner,k=mk()){return budgetRows(k,'expense').filter(x=>surplusEligible(x)&&x.owner===owner&&actual(x.category,'despesa',k)>0).reduce((s,x)=>s+Math.max(0,(+x.budget||0)-actual(x.category,'despesa',k)),0)}
function freeBase(owner,k=mk()){return budgetRows(k,'expense').filter(x=>isFreeRow(x)&&freeOwner(x)===owner).reduce((s,x)=>s+(+x.budget||0),0)}
function freeSpent(owner,k=mk()){return budgetRows(k,'expense').filter(x=>isFreeRow(x)&&freeOwner(x)===owner).reduce((s,x)=>s+actual(x.category,'despesa',k),0)}
function freeWallet(owner,k=mk()){let base=freeBase(owner,k),surplus=surplusFor(owner,k),spent=freeSpent(owner,k);return {base,surplus,spent,available:base+surplus-spent}}
function rule503020(k=mk()){let inc=scopedIncome(k),rows=scopedExpenseRows(k),free=rows.filter(isFreeRow).reduce((s,x)=>s+(+x.budget||0),0),inv=rows.filter(isReserveRow).reduce((s,x)=>s+(+x.budget||0),0),desp=Math.max(0,scopedExpense(k)-free-inv);return {inc,items:[['Despesas',.50,desp],['Investimento / Reserva',.30,inv],['Saldo Livre',.20,free]]}}
function ruleHTML(){let r=rule503020();return `<div class="card section"><div class="toolbar"><div><h2>Meta 50 · 30 · 20</h2><div class="mut">${aaScope==='Casal'?'Consolidado do casal':'Meta individual de '+aaScope}: 50% despesas · 30% investimentos · 20% saldo livre.</div></div><span class="tag">Ganhos ${fmt(r.inc)}</span></div><div class="rule-grid">${r.items.map(x=>{let p=r.inc?x[2]/r.inc*100:0,t=x[1]*100,d=p-t;return `<div class="rule-card"><b>${x[0]}</b><div class="pct">${p.toFixed(1)}%</div><div class="mut">${fmt(x[2])} · meta ${fmt(r.inc*x[1])}</div><div class="mini-bar"><i style="width:${Math.min(100,p/t*100)}%"></i></div><small class="${Math.abs(d)<.1?'positive':((x[0]==='Despesas'&&d>0)||(x[0]!=='Despesas'&&d<0)?'negative':'positive')}">${Math.abs(d)<.1?'Na meta':(d>0?'+':'')+d.toFixed(1)+' p.p. da meta'}</small></div>`}).join('')}</div></div>`}
function walletHTML(){let owners=aaScope==='Casal'?['Assis','Andressa']:[aaScope];return `<div class="chart-grid" style="margin-bottom:16px">${owners.map(o=>{let w=freeWallet(o);return `<div class="card wallet"><span class="tag">Saldo Livre · ${o}</span><div class="big">${fmt(w.available)}</div><div class="mut">Disponível neste mês</div><div class="wallet-flow"><div><small>Orçado</small><b>${fmt(w.base)}</b></div><div><small>Sobras recebidas</small><b class="positive">+${fmt(w.surplus)}</b></div><div><small>Gasto livre</small><b>${fmt(w.spent)}</b></div></div></div>`}).join('')}</div>`}

function catCardV7(x,i){let a=actual(x.category,'despesa'),left=(+x.budget||0)-a,isCons=x.behavior==='consumo',done=!isCons&&a>0,p=x.budget?Math.min(100,a/x.budget*100):0,free=isFreeRow(x),owner=x.owner||'Casal';if(free)left=freeWallet(freeOwner(x)).available;return `<div class="cat" onclick="openCategory(${i})"><div class="cathead"><h3>${esc(x.category)}</h3><span class="owner-badge">${esc(owner)}</span></div><div class="cathead" style="margin-top:7px">${free?'<span class="status ok">Saldo Livre</span>':isCons?'<span class="status">Consumo</span>':`<span class="status ${done?'ok':'warn'}">${done?'✓ Liquidada':'○ Pendente'}</span>`}</div><div class="nums"><div class="num"><small>Orçado</small><b>${fmt(x.budget)}</b></div><div class="num"><small>Realizado</small><b>${fmt(a)}</b></div><div class="num"><small>${free?'Disponível':done&&left>0?'Sobra → livre':'Disponível'}</small><b class="${left>=0?'positive':'negative'}">${fmt(left)}</b></div></div>${isCons?`<div class="bar"><i style="width:${p}%"></i></div>`:''}</div>`}

function renderHome(){let k=mk(),inc=scopedIncome(k),exp=scopedExpense(k),ri=scopedIncome(k,true),re=scopedExpense(k,true),rows=scopedExpenseRows(k),ob=rows.filter(x=>x.behavior!=='consumo'&&!isFreeRow(x)),liq=ob.filter(x=>actual(x.category,'despesa',k)>0).length;$('#home').innerHTML=scopeHTML()+`<div class="hero-strip"><div><span>Central A&A · ${aaScope==='Casal'?'Consolidado':aaScope}</span><br><b>Controle o orçamento de quem realmente paga.</b></div><div class="spark">✦</div></div><div class="kpis"><div class="card kpi" onclick="showIncome()"><label>Receita orçada</label><strong>${fmt(inc)}</strong><span class="mut">Realizado ${fmt(ri)}</span></div><div class="card kpi"><label>Despesas / destinações</label><strong>${fmt(exp)}</strong><span class="mut">Realizado ${fmt(re)}</span></div><div class="card kpi"><label>Obrigações liquidadas</label><strong>${liq} / ${ob.length}</strong><span class="mut">Sobra vai ao Saldo Livre do responsável</span></div><div class="card kpi"><label>Orçamento a distribuir</label><strong class="${Math.abs(inc-exp)<.01?'positive':'negative'}">${fmt(inc-exp)}</strong><span class="mut">Meta: receitas = destinações</span></div></div>`+walletHTML()+ruleHTML()+`<div class="card section"><div class="toolbar"><div><h2>Execução de ${label(k)}</h2><div class="mut">${aaScope==='Casal'?'Consolidado = Assis + Andressa':'Somente o orçamento de '+aaScope}.</div></div><button class="btn soft" onclick="toggleClose()">${db.budget[k].closed?'Reabrir mês':'Fechar mês'}</button></div><div class="budget-grid">${rows.map(x=>catCardV7(x,budgetRows(k,'expense').indexOf(x))).join('')}</div></div>`}

function renderBudget(){let rows=scopedExpenseRows();$('#budget').innerHTML=scopeHTML()+walletHTML()+`<div class="card section"><div class="toolbar"><div><h2>Orçamento · ${label(mk())} · ${aaScope==='Casal'?'Consolidado':aaScope}</h2><div class="mut">Cada despesa mostra quem paga. Obrigações pagas abaixo do orçamento liberam a diferença para o Saldo Livre do responsável.</div></div><button class="btn primary" onclick="newBudgetCatV7()">＋ Categoria no mês</button></div><div class="budget-grid">${rows.map(x=>catCardV7(x,budgetRows(mk(),'expense').indexOf(x))).join('')}</div></div>`}
function newBudgetCatV7(){let opts=db.categories.filter(c=>c.active&&c.type==='despesa');modal(`<div class="mh"><h2>Adicionar categoria</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><label class="full">Categoria<select id="newCat">${opts.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></label><label>Orçamento<input id="newVal" type="number" step=".01"></label><label>Quem paga<select id="newOwner"><option ${aaScope==='Assis'?'selected':''}>Assis</option><option ${aaScope==='Andressa'?'selected':''}>Andressa</option></select></label><label>Comportamento<select id="newBeh"><option value="obrigacao">Obrigação</option><option value="consumo">Consumo</option></select></label><button class="btn primary full" onclick="addBudgetCatV7()">Adicionar</button></div>`)}
function addBudgetCatV7(){budgetRows(mk(),'expense').push({category:$('#newCat').value,budget:+$('#newVal').value||0,behavior:$('#newBeh').value,owner:$('#newOwner').value});persist();closeM();renderAll()}

function categoryModal(x,i,type){let a=actual(x.category,type),closed=db.budget[mk()].closed;modal(`<div class="mh"><div><h2>${esc(x.category)}</h2><div class="mut">${label(mk())} · ${type==='receita'?'Receita':x.behavior==='consumo'?'Consumo':'Obrigação'}</div></div><button class="btn" onclick="closeM()">×</button></div><div class="form"><label>Orçamento<input id="mBudget" type="number" step=".01" value="${x.budget}" ${closed?'disabled':''}></label><label>Realizado atual<input value="${a.toFixed(2)}" disabled></label><label>Adicionar ao realizado<input id="mActual" type="number" step=".01" placeholder="0,00"></label><label>Data<input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label>${type==='despesa'?`<label>Quem paga<select id="mOwner"><option ${x.owner==='Assis'?'selected':''}>Assis</option><option ${x.owner==='Andressa'?'selected':''}>Andressa</option></select></label><label>Comportamento<select id="mBeh"><option value="obrigacao" ${x.behavior!=='consumo'?'selected':''}>Obrigação</option><option value="consumo" ${x.behavior==='consumo'?'selected':''}>Consumo</option></select></label>`:''}<label class="full">Nome da categoria neste mês<input id="mName" value="${esc(x.category)}"></label><label class="full">Observação<input id="mNote" placeholder="Opcional"></label><div class="full actions"><button class="btn primary" onclick="saveCatV8(${i},'${type}')">Salvar</button><button class="btn red" onclick="removeMonthCatV8(${i},'${type}')">Excluir deste mês</button></div></div>${type==='despesa'&&surplusEligible(x)?`<p class="mut">Se esta obrigação for liquidada abaixo do orçamento, a diferença ficará disponível no Saldo Livre de ${esc(x.owner||'quem paga')}.</p>`:''}`)}

function saveCatV8(i,type){let arr=budgetRows(mk(),type==='receita'?'income':'expense'),x=arr[i],old=x.category,newName=$('#mName').value.trim()||old;if(!db.budget[mk()].closed)x.budget=+$('#mBudget').value||0;if(type==='despesa'){x.behavior=$('#mBeh').value;x.owner=$('#mOwner').value}x.category=newName;let v=+$('#mActual').value||0;if(v)db.actuals.push({id:'a'+Date.now(),month:mk(),category:newName,type,amount:v,date:$('#mDate').value,note:$('#mNote').value,owner:type==='despesa'?x.owner:inferredIncomeOwner(x)});persist();closeM();renderAll()}
function removeMonthCatV8(i,type){if(!confirm('Excluir esta categoria somente de '+label(mk())+'? O histórico de outros meses não será alterado.'))return;let arr=budgetRows(mk(),type==='receita'?'income':'expense');arr.splice(i,1);persist();closeM();renderAll()}

function saveCatV7(i,type){let arr=budgetRows(mk(),type==='receita'?'income':'expense'),x=arr[i];if(!db.budget[mk()].closed)x.budget=+$('#mBudget').value||0;if(type==='despesa'){x.behavior=$('#mBeh').value;x.owner=$('#mOwner').value}let v=+$('#mActual').value||0;if(v)db.actuals.push({id:'a'+Date.now(),month:mk(),category:x.category,type,amount:v,date:$('#mDate').value,note:$('#mNote').value,owner:type==='despesa'?x.owner:inferredIncomeOwner(x)});persist();closeM();renderAll()}

function setCardFilterV7(v){cardFilterV7=v;renderCards()}
function renderCards(){let future=months.filter(k=>mi(k)>=mi(mk())).slice(0,8),owners=cardFilterV7==='Todos'?['Assis','Andressa']:[cardFilterV7],shown=db.cards.filter(c=>cardFilterV7==='Todos'||c.owner===cardFilterV7);$('#cards').innerHTML=`<div class="scopebar">${['Todos','Assis','Andressa'].map(v=>`<button class="chip ${cardFilterV7===v?'active':''}" onclick="setCardFilterV7('${v}')">${v==='Todos'?'Todos os cartões':'Nubank '+v}</button>`).join('')}</div><div class="kpis">${owners.map(o=>`<div class="card kpi"><label>Próxima projeção · ${o}</label><strong>${fmt(cardProj(o,future[0]))}</strong><span class="mut">Compras e parcelas futuras</span></div>`).join('')}</div><div class="grid2"><div class="card section"><div class="toolbar"><div><h2>Projeção das faturas</h2><div class="mut">${cardFilterV7==='Todos'?'Assis + Andressa':'Somente Nubank '+cardFilterV7}</div></div><button class="btn primary" onclick="newCard()">＋ Nova compra</button></div><div class="tablewrap"><table><thead><tr><th>Mês</th>${owners.map(o=>`<th class="money">${o}</th>`).join('')}${cardFilterV7==='Todos'?'<th class="money">Total</th>':''}</tr></thead><tbody>${future.map(k=>`<tr><td>${label(k)}</td>${owners.map(o=>`<td class="money">${fmt(cardProj(o,k))}</td>`).join('')}${cardFilterV7==='Todos'?`<td class="money"><b>${fmt(cardProj('Assis',k)+cardProj('Andressa',k))}</b></td>`:''}</tr>`).join('')}</tbody></table></div></div><div class="card section"><h2>Compras cadastradas</h2><div class="mut">${shown.length} lançamento(s).</div><div class="tablewrap"><table><tbody>${shown.slice().reverse().map(c=>`<tr><td><b>${esc(c.title)}</b><div class="mut">${c.owner} · ${c.total>1?c.current+'/'+c.total:'à vista'}</div></td><td class="money">${fmt(c.amount)}</td><td><button class="btn" onclick="editCard('${c.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div></div></div>`}

function barChartHTML(data,title,desc){let max=Math.max(1,...data.map(x=>x[1]));return `<div class="card chart-card"><h2>${title}</h2><div class="mut">${desc}</div>${data.length?`<div class="vchart">${data.map(x=>`<div class="vcol"><div class="vvalue">${fmt(x[1]).replace('R$ ','')}</div><div class="vbar" style="height:${Math.max(3,x[1]/max*160)}px"></div><div class="vlabel">${esc(x[0])}</div></div>`).join('')}</div>`:'<div class="empty">Sem valores neste mês.</div>'}</div>`}
function expenseChartData(k=mk()){let map={};scopedExpenseRows(k).forEach(x=>{if(isFreeRow(x))return;let v=actual(x.category,'despesa',k);if(v<=0)v=+x.budget||0;if(v>0)map[x.category]=(map[x.category]||0)+v});return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,12)}
function freeChartHTML(){let owners=aaScope==='Casal'?['Assis','Andressa']:[aaScope];let data=owners.map(o=>{let w=freeWallet(o);return [o,w.base,w.surplus,w.spent,w.available]});return `<div class="card chart-card"><h2>Saldo Livre</h2><div class="mut">Orçado + sobras de obrigações − gastos feitos com o dinheiro livre.</div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Pessoa</th><th class="money">Orçado</th><th class="money">Sobras</th><th class="money">Gastos</th><th class="money">Disponível</th></tr></thead><tbody>${data.map(x=>`<tr><td><b>${x[0]}</b></td><td class="money">${fmt(x[1])}</td><td class="money positive">+${fmt(x[2])}</td><td class="money">${fmt(x[3])}</td><td class="money"><b>${fmt(x[4])}</b></td></tr>`).join('')}</tbody></table></div></div>`}
function monthlyTrendHTML(){let data=months.map(k=>[label(k),scopedExpense(k,true)]).filter(x=>x[1]>0);return barChartHTML(data,'Evolução das despesas realizadas',`Histórico de ${aaScope==='Casal'?'Assis + Andressa':aaScope}.`)}
function renderAnalytics(){let data=expenseChartData();$('#analytics').innerHTML=scopeHTML()+ruleHTML()+`<div class="chart-grid">${barChartHTML(data,'Para onde o dinheiro está indo','Categorias do mês selecionado, respeitando quem paga.')}${freeChartHTML()}</div><div style="margin-top:16px">${monthlyTrendHTML()}</div>`}

function aaProjection(){let aa=db.reserves.find(r=>r.id==='aa'),now=new Date(),currentKey=monthKeyFromDate(now),keys=Object.keys(db.budget).filter(k=>/^(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\d{2}$/.test(k)),mn=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];keys.sort((a,b)=>(2000+ +a.slice(-2))*12+mn.indexOf(a.slice(0,3))-((2000+ +b.slice(-2))*12+mn.indexOf(b.slice(0,3))));let ci=keys.indexOf(currentKey);if(ci<0)ci=0;let future=keys.slice(ci),base=rValue(aa),bal=base,rate=+aa.rate/100,rows=[],totalInterest=0;future.forEach((k,n)=>{let br=budgetRows(k,'expense').find(x=>norm(x.category)==='reserva'),planned=br?+br.budget:0,real=actual('reserva','despesa',k),contribution=n===0?Math.max(0,planned-real):planned,interest=bal*rate;totalInterest+=interest;bal+=interest+contribution;rows.push({key:k,label:label(k).replace('20','/'),total:bal,contribution,interest,totalInterest,growth:bal-base})});return {base,rows,totalContrib:rows.reduce((s,x)=>s+x.contribution,0),totalInterest,final:rows.length?rows[rows.length-1].total:base}}
function aaProjectionHTML(){let p=aaProjection();if(!p.rows.length)return '';let max=Math.max(...p.rows.map(x=>x.total),p.base);return `<div class="card reserve-projection"><div class="projection-head"><div><span class="tag">A&A · rota patrimonial</span><h2>Realizado + projeção futura</h2><div class="mut">O saldo cresce todo mês pelo rendimento composto da taxa cadastrada, mesmo quando o aporte for zero.</div></div><div class="projection-kpis"><div><small>Saldo atual</small><b>${fmt(p.base)}</b></div><div><small>Rendimento projetado</small><b>${fmt(p.totalInterest)}</b></div><div><small>Saldo projetado</small><b>${fmt(p.final)}</b></div></div></div><div class="legend"><span><i class="lr"></i>Saldo atual</span><span><i class="lp"></i>Crescimento futuro</span></div><div class="stack-chart">${p.rows.map((x,i)=>{let realH=p.base/max*230,growthH=Math.max(0,x.growth)/max*230;return `<div class="stack-col ${i===0?'current':''}" title="${x.label} · ${fmt(x.total)} · rendimento acumulado ${fmt(x.totalInterest)}"><div class="stack-value">${fmt(x.total).replace('R$ ','')}</div><div class="stack-bars"><div class="stack-proj" style="height:${growthH}px"></div><div class="stack-real" style="height:${realH}px"></div></div><div class="stack-label">${x.label}</div></div>`}).join('')}</div></div>`}
function renderReserves(){let personal=db.reserves.filter(r=>r.owner==='Casal').reduce((s,r)=>s+rValue(r),0),proj=aaProjection();$('#reserves').innerHTML=`<div class="kpis"><div class="card kpi"><label>Patrimônio financeiro do casal</label><strong>${fmt(personal)}</strong><span class="mut">A&A + reservas com objetivos específicos</span></div><div class="card kpi"><label>A&A hoje</label><strong>${fmt(proj.base)}</strong><span class="mut">Saldo realizado corrigido pela taxa cadastrada</span></div><div class="card kpi"><label>Rendimento projetado</label><strong>${fmt(proj.totalInterest)}</strong><span class="mut">Juros compostos no período exibido</span></div><div class="card kpi"><label>A&A projetado</label><strong>${fmt(proj.final)}</strong><span class="mut">Rendimento + eventuais aportes</span></div></div><div class="reserve-grid">${db.reserves.map((r,i)=>{let v=rValue(r),goal=+r.goal||0,p=goal?Math.min(100,v/goal*100):0;return `<div class="card reserve"><span class="tag">${esc(r.owner)}</span><h2>${esc(r.name)}</h2><div class="big">${fmt(v)}</div><div class="mut">${esc(r.purpose)} · ${r.rate}% a.m.</div>${goal?`<div class="goal"><i style="width:${p}%"></i></div><small>${p.toFixed(1)}% da meta de ${fmt(goal)}</small>`:''}<div class="actions" style="margin-top:16px"><button class="btn" onclick="editReserve(${i})">Editar</button><button class="btn soft" onclick="projectReserve(${i})">Simular</button></div></div>`}).join('')}${aaProjectionHTML()}</div>`}

function openQuick(){let rows=scopedExpenseRows();modal(`<div class="mh"><h2>Registro rápido · ${aaScope==='Casal'?'Consolidado':aaScope}</h2><button class="btn" onclick="closeM()">×</button></div><div class="form"><label class="full">Categoria<select id="qCat">${rows.map(x=>`<option value="${budgetRows(mk(),'expense').indexOf(x)}">${esc(x.category)} · ${esc(x.owner||'Casal')}</option>`).join('')}</select></label><label>Valor<input id="qVal" type="number" step=".01" autofocus></label><label>Data<input id="qDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><button class="btn primary full" onclick="saveQuickV7()">Registrar despesa</button></div>`)}
function saveQuickV7(){let x=budgetRows(mk(),'expense')[+$('#qCat').value],v=+$('#qVal').value||0;if(v)db.actuals.push({id:'a'+Date.now(),month:mk(),category:x.category,type:'despesa',amount:v,date:$('#qDate').value,owner:x.owner||'Casal'});persist();closeM();renderAll()}

function inferPayerV8(x){let n=norm(x.category);if(n.includes('andressa'))return 'Andressa';if(n.includes('assis'))return 'Assis';return x.owner&&x.owner!=='Casal'?x.owner:'Assis'}
function migrateV7(){Object.values(db.budget).forEach(m=>{(m.expense||[]).forEach(x=>{let n=norm(x.category);if(n==='assis')x.owner='Assis';else if(n==='andressa')x.owner='Andressa';else if(!x.owner||x.owner==='Casal')x.owner=inferPayerV8(x)})});db.version=Math.max(8,+db.version||0)}
migrateV7();
function renderAll(){renderHome();renderBudget();renderCards();renderReserves();renderAnalytics();renderFerreira();renderCategories();renderBackup()}

syncCardBudgets();persist();renderAll();
</script>
<script>
/* ===== A&A v9 — correções estruturais ===== */
const AA_V9 = true;

function actualOwned(cat,type,k=mk(),owner=null){
  return db.actuals.filter(a=>{
    if(a.month!==k || a.type!==type || norm(a.category)!==norm(cat)) return false;
    if(!owner) return true;
    if(a.owner) return a.owner===owner;
    const row=(type==='despesa'?budgetRows(k,'expense'):budgetRows(k,'income'))
      .find(r=>norm(r.category)===norm(cat) && (type!=='despesa'||r.owner===owner));
    return !!row;
  }).reduce((s,a)=>s+(+a.amount||0),0);
}

function scopedExpense(k=mk(),real=false,scope=aaScope){
  const rows=budgetRows(k,'expense').filter(x=>scope==='Casal'||x.owner===scope);
  return rows.reduce((s,x)=>s+(real?actualOwned(x.category,'despesa',k,x.owner):(+x.budget||0)),0);
}
function scopedIncome(k=mk(),real=false,scope=aaScope){
  const rows=budgetRows(k,'income').filter(x=>scope==='Casal'||inferredIncomeOwner(x)===scope);
  return rows.reduce((s,x)=>s+(real?actualOwned(x.category,'receita',k,inferredIncomeOwner(x)):(+x.budget||0)),0);
}

function categoryModal(x,i,type){
  const owner=type==='despesa'?(x.owner||'Assis'):inferredIncomeOwner(x);
  const a=actualOwned(x.category,type,mk(),type==='despesa'?owner:null);
  const closed=db.budget[mk()].closed;
  modal(`<div class="mh"><div><h2>Editar categoria</h2><div class="mut">${label(mk())} · alteração somente deste mês</div></div><button class="btn" onclick="closeM()">×</button></div>
  <div class="form">
    <label class="full"><b>Nome da categoria</b><input id="mName" value="${esc(x.category)}" placeholder="Ex.: Apartamento"></label>
    <label>Orçamento<input id="mBudget" type="number" step=".01" value="${x.budget}" ${closed?'disabled':''}></label>
    ${type==='despesa'?`<label>Quem paga<select id="mOwner"><option ${owner==='Assis'?'selected':''}>Assis</option><option ${owner==='Andressa'?'selected':''}>Andressa</option></select></label>
    <label>Comportamento<select id="mBeh"><option value="obrigacao" ${x.behavior!=='consumo'?'selected':''}>Obrigação</option><option value="consumo" ${x.behavior==='consumo'?'selected':''}>Consumo</option></select></label>`:''}
    <label>Realizado atual<input value="${a.toFixed(2)}" disabled></label>
    <label>Adicionar ao realizado<input id="mActual" type="number" step=".01" placeholder="0,00"></label>
    <label>Data<input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
    <label class="full">Observação<input id="mNote" placeholder="Opcional"></label>
    <div class="full actions">
      <button class="btn primary" onclick="saveCatV9(${i},'${type}')">Salvar alterações</button>
      <button class="btn red" onclick="removeMonthCatV8(${i},'${type}')">Excluir deste mês</button>
    </div>
  </div>
  ${closed?'<p class="mut">Mês fechado: reabra o mês para alterar o orçamento.</p>':''}`);
}

function saveCatV9(i,type){
  const arr=budgetRows(mk(),type==='receita'?'income':'expense');
  const x=arr[i]; if(!x)return;
  const oldName=x.category;
  const oldOwner=type==='despesa'?(x.owner||'Assis'):inferredIncomeOwner(x);
  const newName=($('#mName').value||'').trim()||oldName;

  if(!db.budget[mk()].closed) x.budget=+$('#mBudget').value||0;
  if(type==='despesa'){
    x.behavior=$('#mBeh').value;
    x.owner=$('#mOwner').value;
  }
  x.category=newName;

  // Renomeia somente os realizados do mês atual ligados à linha editada.
  db.actuals.forEach(a=>{
    if(a.month===mk() && a.type===type && norm(a.category)===norm(oldName)){
      if(type!=='despesa' || !a.owner || a.owner===oldOwner){
        a.category=newName;
        if(type==='despesa') a.owner=x.owner;
      }
    }
  });

  const v=+$('#mActual').value||0;
  if(v){
    db.actuals.push({
      id:'a'+Date.now(),month:mk(),category:newName,type,amount:v,
      date:$('#mDate').value,note:$('#mNote').value,
      owner:type==='despesa'?x.owner:inferredIncomeOwner(x)
    });
  }
  persist(); closeM(); renderAll();
}

function aaProjection(){
  const aa=db.reserves.find(r=>r.id==='aa');
  const rate=(+aa.rate||0)/100;
  const now=new Date();
  const monthNames=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  const serial=k=>(2000+(+k.slice(-2)))*12+monthNames.indexOf(k.slice(0,3));
  const currentSerial=now.getFullYear()*12+now.getMonth();
  const keys=Object.keys(db.budget)
    .filter(k=>/^(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\d{2}$/.test(k))
    .sort((a,b)=>serial(a)-serial(b))
    .filter(k=>serial(k)>=currentSerial);

  let balance=rValue(aa), totalInterest=0, totalContrib=0;
  const rows=keys.map((k,idx)=>{
    const reserveRows=budgetRows(k,'expense').filter(x=>norm(x.category)==='reserva');
    let contribution=reserveRows.reduce((s,x)=>s+(+x.budget||0),0);
    if(idx===0){
      const realized=reserveRows.reduce((s,x)=>s+actualOwned(x.category,'despesa',k,x.owner),0);
      contribution=Math.max(0,contribution-realized);
    }
    const opening=balance;
    const interest=opening*rate;
    balance=opening+interest+contribution;
    totalInterest+=interest;
    totalContrib+=contribution;
    return {key:k,label:label(k),opening,interest,contribution,total:balance};
  });
  return {base:rValue(aa),rows,totalInterest,totalContrib,final:rows.length?rows.at(-1).total:rValue(aa)};
}

function aaProjectionHTML(){
  const p=aaProjection();
  if(!p.rows.length) return '';
  const vals=[p.base,...p.rows.map(r=>r.total)];
  let min=Math.min(...vals), max=Math.max(...vals);
  if(max-min<1){max=min+1}
  const W=760,H=260,PX=38,PY=28;
  const pts=p.rows.map((r,i)=>{
    const x=p.rows.length===1?W/2:PX+i*(W-2*PX)/(p.rows.length-1);
    const y=PY+(max-r.total)/(max-min)*(H-2*PY);
    return {...r,x,y};
  });
  const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  return `<div class="card reserve-projection">
    <div class="projection-head">
      <div><span class="tag">A&A · juros compostos</span><h2>Projeção mensal do patrimônio</h2>
      <div class="mut">Saldo anterior + rendimento de ${db.reserves.find(r=>r.id==='aa').rate}% a.m. + aporte do mês = novo saldo.</div></div>
      <div class="projection-kpis">
        <div><small>Saldo atual</small><b>${fmt(p.base)}</b></div>
        <div><small>Rendimentos projetados</small><b>${fmt(p.totalInterest)}</b></div>
        <div><small>Saldo final</small><b>${fmt(p.final)}</b></div>
      </div>
    </div>
    <div style="overflow-x:auto;padding-top:10px">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:680px;height:300px;overflow:visible">
        <path d="${path}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="color:#31d69b"/>
        ${pts.map(q=>`<circle cx="${q.x}" cy="${q.y}" r="6" fill="#071018" stroke="#52d8e8" stroke-width="4"/>
          <text x="${q.x}" y="${Math.max(16,q.y-13)}" text-anchor="middle" fill="#eef6f8" font-size="12" font-weight="800">${fmt(q.total).replace('R$ ','')}</text>
          <text x="${q.x}" y="${H-5}" text-anchor="middle" fill="#8497a3" font-size="11">${q.label.replace('/20','/')}</text>`).join('')}
      </svg>
    </div>
    <div class="projection-table">
      ${p.rows.map(r=>`<div class="projection-point"><small>${r.label}</small><b>${fmt(r.total)}</b>
      <div class="mut">Rendimento: <span class="positive">+${fmt(r.interest)}</span></div>
      <div class="mut">Aporte: +${fmt(r.contribution)}</div></div>`).join('')}
    </div>
  </div>`;
}

function renderReserves(){
  const personal=db.reserves.filter(r=>r.owner==='Casal').reduce((s,r)=>s+rValue(r),0);
  const proj=aaProjection();
  $('#reserves').innerHTML=`<div class="kpis">
    <div class="card kpi"><label>Patrimônio financeiro do casal</label><strong>${fmt(personal)}</strong><span class="mut">A&A + objetivos específicos</span></div>
    <div class="card kpi"><label>A&A hoje</label><strong>${fmt(proj.base)}</strong><span class="mut">Saldo atual</span></div>
    <div class="card kpi"><label>Rendimento projetado</label><strong>${fmt(proj.totalInterest)}</strong><span class="mut">Juros compostos no período</span></div>
    <div class="card kpi"><label>A&A projetado</label><strong>${fmt(proj.final)}</strong><span class="mut">Saldo final com juros e aportes</span></div>
  </div>
  <div class="reserve-grid">${db.reserves.map((r,i)=>{
    const v=rValue(r),goal=+r.goal||0,p=goal?Math.min(100,v/goal*100):0;
    return `<div class="card reserve"><span class="tag">${esc(r.owner)}</span><h2>${esc(r.name)}</h2>
    <div class="big">${fmt(v)}</div><div class="mut">${esc(r.purpose)} · ${r.rate}% a.m.</div>
    ${goal?`<div class="goal"><i style="width:${p}%"></i></div><small>${p.toFixed(1)}% da meta de ${fmt(goal)}</small>`:''}
    <div class="actions" style="margin-top:16px"><button class="btn" onclick="editReserve(${i})">Editar</button><button class="btn soft" onclick="projectReserve(${i})">Simular</button></div></div>`;
  }).join('')}${aaProjectionHTML()}</div>`;
}

// Marca visual para confirmar que esta versão carregou.
document.title='A&A Finanças · v9';

</script>

    const p=db.incomeProfile[name];
    const fix=p.Fixo.reduce((s,x)=>s+x.budget,0), ext=p.Extra.reduce((s,x)=>s+x.budget,0);

function renderHome(){

    <div class="kpis home-secondary">
      <div class="card kpi"><label>Despesas / destinações</label><strong>${fmt(exp)}</strong><span class="mut">Realizado ${fmt(re)}</span></div>

      <div class="card kpi"><label>Orçamento a distribuir</label><strong class="${Math.abs(inc-exp)<.01?'positive':'negative'}">${fmt(inc-exp)}</strong><span class="mut">Meta: receitas = destinações</span></div>
    </div>
    ${walletHTML()}${ruleHTML()}
    <div class="card section"><div class="toolbar"><div><h2>Execução de ${label(k)}</h2><div class="mut">${aaScope==='Casal'?'Consolidado = Assis + Andressa':'Somente o orçamento de '+aaScope}.</div></div><button class="btn soft" onclick="toggleClose()">${db.budget[k].closed?'Reabrir mês':'Fechar mês'}</button></div>
    <div class="budget-grid">${rows.map(x=>catCardV7(x,budgetRows(k,'expense').indexOf(x))).join('')}</div></div>`;
}

function aaProjectionV10(){
  const aa=db.reserves.find(r=>r.id==='aa');
  const rate=(+aa.rate||0)/100;
  const monthNames=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  const serial=k=>(2000+(+k.slice(-2)))*12+monthNames.indexOf(k.slice(0,3));
  const start=serial(mk());
  let keys=Object.keys(db.budget)
    .filter(k=>/^(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\d{2}$/.test(k))
    .sort((a,b)=>serial(a)-serial(b))
    .filter(k=>serial(k)>=start);

  // Mantém uma projeção útil mesmo se ainda não houver muitos meses cadastrados.
  if(keys.length<6){
    let last=keys.length?serial(keys[keys.length-1]):start-1;
    while(keys.length<6){
      last++;
      const y=Math.floor(last/12), m=last%12;
      keys.push(monthNames[m]+String(y).slice(-2));
    }
  }

  let balance=rValue(aa), totalInterest=0, totalContrib=0;
  const rows=keys.map((k,idx)=>{
    const reserveRows=budgetRows(k,'expense').filter(x=>norm(x.category)==='reserva');
    let contribution=reserveRows.reduce((s,x)=>s+(+x.budget||0),0);
    if(idx===0 && reserveRows.length){
      const realized=reserveRows.reduce((s,x)=>s+actualOwned(x.category,'despesa',k,x.owner),0);
      contribution=Math.max(0,contribution-realized);
    }
    const opening=balance;
    const interest=opening*rate;
    balance=opening+interest+contribution;
    totalInterest+=interest; totalContrib+=contribution;
    return {key:k,label:monthNames.indexOf(k.slice(0,3))>=0?label(k):k,opening,interest,contribution,total:balance};
  });
  return {base:rValue(aa),rate:(+aa.rate||0),rows,totalInterest,totalContrib,final:rows.at(-1)?.total||rValue(aa)};
}

function aaProjectionHTML(){
  const p=aaProjectionV10();
  if(!p.rows.length)return '';
  const values=[p.base,...p.rows.map(r=>r.total)];
  const rawMin=Math.min(...values), rawMax=Math.max(...values);
  const pad=Math.max((rawMax-rawMin)*0.18, rawMax*.008, 100);
  const min=Math.max(0,rawMin-pad), max=rawMax+pad;
  const W=Math.max(720,p.rows.length*112), H=280, L=72,R=28,T=30,B=48;
  const X=i=>L+(p.rows.length===1?(W-L-R)/2:i*(W-L-R)/(p.rows.length-1));
  const Y=v=>T+(max-v)/(max-min)*(H-T-B);
  const pts=p.rows.map((r,i)=>({...r,x:X(i),y:Y(r.total)}));
  const line=pts.map((q,i)=>(i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1)).join(' ');
  const area=line+` L ${pts.at(-1).x.toFixed(1)} ${H-B} L ${pts[0].x.toFixed(1)} ${H-B} Z`;
  const grid=[0,.25,.5,.75,1].map(t=>{
    const v=max-(max-min)*t,y=T+(H-T-B)*t;
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
    <text x="${L-10}" y="${y+4}" text-anchor="end" fill="#7f929e" font-size="11">${(v/1000).toFixed(1)}k</text>`;
  }).join('');
  return `<div class="card patrimony-v10">
    <div class="pat-head">
      <div><span class="tag">A&A · ${p.rate.toFixed(2).replace('.',',')}% a.m.</span><h2>Evolução projetada do patrimônio</h2><div class="mut">Juros compostos calculados sobre o saldo de cada mês. Aportes são somados depois do rendimento.</div></div>
      <div class="pat-total"><small>Saldo projetado</small><strong>${fmt(p.final)}</strong><span class="positive">+ ${fmt(p.totalInterest)} em rendimentos</span></div>
    </div>
    <div class="pat-chart-scroll"><svg viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:none;height:280px;display:block">
      <defs><linearGradient id="aaAreaV10" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#31d69b" stop-opacity=".24"/><stop offset="100%" stop-color="#31d69b" stop-opacity=".015"/></linearGradient></defs>
      ${grid}
      <path d="${area}" fill="url(#aaAreaV10)"/>
      <path d="${line}" fill="none" stroke="#31d69b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(q=>`<circle cx="${q.x}" cy="${q.y}" r="5" fill="#0b151d" stroke="#52d8e8" stroke-width="3"/>
      <text x="${q.x}" y="${H-17}" text-anchor="middle" fill="#9fb0ba" font-size="11">${q.label.replace('/20','/')}</text>`).join('')}
    </svg></div>
    <div class="pat-months">${p.rows.map(r=>`<div class="pat-month"><small>${r.label}</small><b>${fmt(r.total)}</b><span>Juros <em>+${fmt(r.interest)}</em></span><span>Aporte +${fmt(r.contribution)}</span></div>`).join('')}</div>
  </div>`;
}

function renderReserves(){
  const personal=db.reserves.filter(r=>r.owner==='Casal').reduce((s,r)=>s+rValue(r),0);
  const p=aaProjectionV10();
  $('#reserves').innerHTML=`
    <div class="kpis">
      <div class="card kpi"><label>Patrimônio financeiro do casal</label><strong>${fmt(personal)}</strong><span class="mut">A&A + objetivos específicos</span></div>
      <div class="card kpi"><label>A&A hoje</label><strong>${fmt(p.base)}</strong><span class="mut">Saldo atual</span></div>
      <div class="card kpi"><label>Rendimentos projetados</label><strong class="positive">+${fmt(p.totalInterest)}</strong><span class="mut">${p.rate.toFixed(2).replace('.',',')}% a.m. composto</span></div>
      <div class="card kpi"><label>A&A projetado</label><strong>${fmt(p.final)}</strong><span class="mut">Juros + aportes</span></div>
    </div>
    ${aaProjectionHTML()}
    <div class="reserve-grid reserve-cards-v10">${db.reserves.map((r,i)=>{
      const v=rValue(r),goal=+r.goal||0,pct=goal?Math.min(100,v/goal*100):0;
      return `<div class="card reserve"><span class="tag">${esc(r.owner)}</span><h2>${esc(r.name)}</h2><div class="big">${fmt(v)}</div>
      <div class="mut">${esc(r.purpose)} · ${r.rate}% a.m.</div>${goal?`<div class="goal"><i style="width:${pct}%"></i></div><small>${pct.toFixed(1)}% da meta de ${fmt(goal)}</small>`:''}
      <div class="actions" style="margin-top:16px"><button class="btn" onclick="editReserve(${i})">Editar</button><button class="btn soft" onclick="projectReserve(${i})">Simular</button></div></div>`;
    }).join('')}</div>`;
}

function renderAll(){
  ensureIncomeProfileV10();
  renderHome();renderBudget();renderCards();renderReserves();renderAnalytics();renderFerreira();renderCategories();renderBackup();
}

<script>
/* ===== A&A v11 — Modo Visitante + Consultor IA (demo seguro) ===== */
let aaVisitor=false;
const _fmtReal=fmt;
const _renderAllReal=renderAll;

const VISITOR={
  Assis:{fixed:2,extra:1,total:3},
  Andressa:{fixed:2,extra:1,total:3},
  Casal:{fixed:4,extra:2,total:6}
};
function visitorScopeKey(){return aaScope==='Casal'?'Casal':aaScope}
function visitorMoney(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v)}
function maskTextV11(root=document){
  if(!aaVisitor)return;
  const replacements=[
    ['Canyon Salário','Salário principal'],['Canyon Benefícios','Benefícios'],
    ['Bônus Canyon','Renda extra'],['Ferreira Imóveis','Projeto pessoal'],
    ['Instituto Salário','Salário principal'],['SUS','Renda complementar'],['Projeto','Projeto pessoal'],
    ['Apto','Moradia'],['apto','Moradia'],['Apartamento','Moradia']
  ];
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let n; while(n=walker.nextNode()){
    if(n.parentElement && ['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;
    replacements.forEach(([a,b])=>{if(n.nodeValue.includes(a))n.nodeValue=n.nodeValue.split(a).join(b)});
  }
}
function visitorBannerV11(){
  document.querySelectorAll('.demo-banner').forEach(x=>x.remove());
  if(!aaVisitor)return;
  const active=document.querySelector('section.active,.page.active,main')||document.body;
  const b=document.createElement('div'); b.className='demo-banner';
  b.innerHTML='<b>Modo Visitante ativo</b> · demonstração com nomes e valores genéricos. Seus dados pessoais continuam preservados no aparelho.';
  active.prepend(b);
}
function renderVisitorOverlayV11(){
  if(!aaVisitor)return;
  const r=VISITOR[visitorScopeKey()]||VISITOR.Casal;
  const cards=[...document.querySelectorAll('.income-v10 .kpi strong')];
  if(cards[0])cards[0].textContent=visitorMoney(r.fixed);
  if(cards[1])cards[1].textContent=visitorMoney(r.extra);
  if(cards[2])cards[2].textContent=visitorMoney(r.total);

  // Mascara todos os valores monetários visíveis sem alterar o banco.
  document.querySelectorAll('strong,.big,b,.pat-month,td,.amount').forEach((el,i)=>{
    if(/R\$\s?[\d.]+,\d{2}/.test(el.textContent||'')){
      const vals=[1,2,3,4,5,6,8,10];
      el.innerHTML=el.innerHTML.replace(/R\$\s?[\d.]+,\d{2}/g,()=>visitorMoney(vals[i%vals.length]));
    }
  });
  maskTextV11();
  visitorBannerV11();
}
function renderAll(){
  _renderAllReal();
  if(aaVisitor)setTimeout(renderVisitorOverlayV11,0);
}
function toggleVisitorV11(){
  aaVisitor=!aaVisitor;
  document.getElementById('visitorBtn').classList.toggle('on',aaVisitor);
  document.getElementById('visitorBtn').textContent=aaVisitor?'Visitante ✓':'Modo visitante';
  renderAll();
}
function consultorV11(){
  const scope=aaVisitor?'casal demonstrativo':(aaScope==='Casal'?'casal':aaScope);
  modal(`<div class="mh"><div><span class="tag">✦ CONSULTOR IA</span><h2>Consultor A&A</h2><div class="mut">${aaVisitor?'Demonstração segura para visitantes':'Módulo preparado para integração com IA'}</div></div><button class="btn" onclick="closeM()">×</button></div>
  <div class="ai-demo">
    <div class="ai-box"><b>Análise de ${scope}</b><p class="mut">${aaVisitor?'O orçamento demonstrativo está equilibrado. A recomendação é acompanhar gastos variáveis, manter uma parcela da renda destinada à reserva e revisar o realizado antes do fechamento do mês.':'O Consultor já está na interface. Para respostas reais e personalizadas, a próxima etapa é conectar o app a um backend seguro e à API da IA; nenhuma chave será colocada neste index público.'}</p></div>
    <div class="ai-q"><button class="btn soft" onclick="aiDemoAnswerV11('mes')">Analisar meu mês</button><button class="btn soft" onclick="aiDemoAnswerV11('cortes')">Onde posso melhorar?</button><button class="btn soft" onclick="aiDemoAnswerV11('orcamento')">Sugerir orçamento</button></div>
    <label><b>Pergunte ao consultor</b><input id="aiAskV11" placeholder="Ex.: Como posso melhorar meu orçamento?"></label>
    <button class="btn primary" onclick="aiDemoAnswerV11('pergunta')">Perguntar</button>
    <div id="aiAnswerV11" class="ai-box mut">As respostas desta versão são demonstrativas. O módulo não envia seus dados para serviços externos.</div>
  </div>`);
}
function aiDemoAnswerV11(kind){
  const q=document.getElementById('aiAskV11')?.value||'';
  const answers={
    mes:'Seu mês deve ser acompanhado por três pontos: receitas, obrigações e gastos variáveis. O ideal é comparar orçamento e realizado antes de aumentar o Saldo Livre.',
    cortes:'Priorize revisar categorias variáveis que ultrapassaram o orçamento. Evite reduzir reservas automaticamente para compensar consumo acima do planejado.',
    orcamento:'Uma boa proposta começa pelas obrigações, define a meta de reserva e distribui o restante entre consumo e Saldo Livre. A versão conectada à IA fará isso usando seus números reais.',
    pergunta:q?`Pergunta registrada: “${q}”. Na versão conectada, o Consultor responderá usando orçamento, realizado, cartões e patrimônio do A&A.`:'Digite uma pergunta para o Consultor.'
  };
  const el=document.getElementById('aiAnswerV11'); if(el)el.textContent=answers[kind];
}
function installV11Controls(){
  if(document.getElementById('visitorBtn'))return;
  const box=document.createElement('div'); box.className='demo-switch';

document.title='A&A Finanças · v11';

function financeProjectionV12(){
  const f=db.financing||FINANCE_V12, out=[];
  let bal=+f.balance||0;
  const r=(+f.nominalAnnual||0)/100/12;
  const amort=Math.max(0,+f.monthAmortization||0);
  const start=new Date(2026,9,3);
  for(let i=0;i<Math.min(+f.remaining||0,360);i++){
    let interest=bal*r, payment=Math.min(bal+interest,amort+interest);
    bal=Math.max(0,bal-amort);
    let d=new Date(start.getFullYear(),start.getMonth()+i,3);
    out.push({n:(+f.paidCount||0)+i+1,date:d.toLocaleDateString('pt-BR'),payment,interest,amort:Math.min(amort,bal+amort),balance:bal});
    if(bal<=0)break;
  }
  return out;
}

  </div>`;
